<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mjolnir LA S3 Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --kadence-green: #70A143; --kadence-tangerine: #F26A2C; --kadence-light-orange: #F99B28; --kadence-watermelon-red: #F94E4B;
  --kadence-black: #231F20; --kadence-midnight-grey: #2C2C33;
  --kadence-light-orange-12: #FEF3E5; --kadence-watermelon-red-12: #FEEAE9;
  --kadence-font: 'Montserrat', Arial, sans-serif; --kadence-dot: var(--kadence-green);
  --muted: rgba(255, 255, 255, .72); --line: rgba(255, 255, 255, .2); --field-line: rgba(255, 255, 255, .34);
  --panel-text: #2C2C33; --panel-muted: rgba(44, 44, 51, .62); --panel-line: rgba(35, 31, 32, .1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--kadence-midnight-grey); color: #fff; font: 400 15px/1.55 var(--kadence-font); }
main { max-width: 600px; margin: 0 auto; padding: 56px 24px 48px; }
h1 { font-size: 30px; font-weight: 700; line-height: 1.2; margin: 0 0 40px; letter-spacing: -.01em; color: #fff; }
.dot { color: var(--kadence-dot); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.field { margin-bottom: 26px; }
label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
input, select { font: inherit; width: 100%; max-width: 340px; padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 6px; background: rgba(255, 255, 255, .08); color: #fff; color-scheme: dark; }
input:-webkit-autofill { -webkit-text-fill-color: #fff; box-shadow: 0 0 0 100px #3a3a43 inset; caret-color: #fff; }
select option { color: var(--panel-text); background: #fff; }
button { font: 500 14px var(--kadence-font); padding: 10px 18px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .5); background: transparent; color: #fff; cursor: pointer; }
button:hover { border-color: #fff; }
button.primary { background: var(--kadence-green); border-color: var(--kadence-green); color: #fff; font-weight: 700; }
button.primary:hover { filter: brightness(1.1); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.link { border: 0; padding: 0; background: none; font-weight: 400; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
button.link:hover { color: var(--kadence-tangerine); }
:focus-visible { outline: 2px solid var(--kadence-tangerine); outline-offset: 2px; }
#scanInfo { margin: -14px 0 26px; }
.msg { padding: 12px 14px; margin-bottom: 24px; font-size: 14px; color: var(--panel-text); border-left: 3px solid var(--kadence-watermelon-red); background: var(--kadence-watermelon-red-12); border-radius: 0 6px 6px 0; }
.msg.warn { border-left-color: var(--kadence-light-orange); background: var(--kadence-light-orange-12); }

#runView { margin-top: 44px; }
.phase { font-weight: 600; margin-bottom: 10px; }
.bar { height: 6px; background: rgba(255, 255, 255, .22); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--kadence-green); transition: width .25s; }
#statline { margin: 10px 0 0; }
.failed { font-weight: 600; color: #fff; }
.failed::before, .st::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--kadence-watermelon-red); }

details { margin-top: 28px; }
summary { cursor: pointer; font-weight: 600; font-size: 15px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; table-layout: fixed; }
col.c1 { width: 58%; } col.c2 { width: 14%; } col.c3 { width: 28%; }
td { padding: 7px 6px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.name { word-break: break-all; }
td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
.st::before { background: rgba(255, 255, 255, .45); }
.st-done::before { background: var(--kadence-green); }
.st-uploading::before, .st-hashing::before { background: var(--kadence-light-orange); }
.st-failed::before { background: var(--kadence-watermelon-red); }

.loghead { display: flex; justify-content: space-between; align-items: baseline; margin: 32px 0 8px; }
.loghead .sub { font-weight: 600; }
.loghead .row { gap: 16px; }
#log { background: #fff; color: var(--panel-text); border-radius: 6px; max-height: 280px; overflow: auto; font-size: 13px; }
#log div { display: grid; grid-template-columns: 66px 1fr; gap: 10px; padding: 6px 12px; border-left: 3px solid transparent; border-top: 1px solid var(--panel-line); }
#log div:first-child { border-top: 0; }
#log .t { color: var(--panel-muted); font-variant-numeric: tabular-nums; }
#log .warn { border-left-color: var(--kadence-light-orange); background: var(--kadence-light-orange-12); }
#log .error { border-left-color: var(--kadence-watermelon-red); background: var(--kadence-watermelon-red-12); }
#log .ok { border-left-color: var(--kadence-green); }

footer { margin-top: 64px; font-size: 12px; font-weight: 300; color: var(--muted); }
footer button.link { font-size: 12px; margin-left: 6px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Mjolnir LA S3 Upload<span class="dot">.</span></h1>

  <section id="authView" hidden>
    <div id="authMsg" class="msg" hidden></div>
    <form id="signInForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <form id="newPwForm" hidden>
      <p class="muted">Choose a new password to finish setting up your account.</p>
      <div class="field"><label for="newPw">New password</label><input id="newPw" type="password" autocomplete="new-password" required></div>
      <button class="primary" type="submit">Save and sign in</button>
    </form>
  </section>

  <section id="appView" hidden>
    <div id="compat" class="msg warn" hidden>This browser cannot read local folders. Open this page in Chrome or Edge on a desktop computer.</div>

    <div class="field">
      <label>Folder</label>
      <div class="row"><button id="pickFolder">Choose folder</button><span id="folderName" class="muted">The folder that holds the dated subfolders</span></div>
    </div>
    <div class="field" id="dateField" hidden>
      <label for="dateSelect">Date</label>
      <select id="dateSelect" disabled></select>
    </div>
    <p id="scanInfo" class="muted small"></p>

    <div class="row">
      <button id="start" class="primary" disabled>Start upload</button>
      <button id="cancel" hidden>Cancel</button>
    </div>

    <div id="runView" hidden>
      <div id="phase" class="phase"></div>
      <div class="bar"><i id="bar"></i></div>
      <p id="statline" class="muted small"></p>

      <details id="filesBox">
        <summary>Files <span id="fileCount" class="muted"></span></summary>
        <table>
          <colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>
          <tbody id="rows"></tbody>
        </table>
        <p id="rowsNote" class="muted small"></p>
      </details>

      <div class="loghead">
        <span class="sub">Log</span>
        <span class="row"><button id="dlLog" class="link">Download log</button><button id="dlCsv" class="link">Download report</button></span>
      </div>
      <div id="log" role="log" aria-live="polite"></div>
    </div>
  </section>

  <footer id="who" hidden><span id="whoName"></span><button id="signOut" class="link">Sign out</button></footer>
</main>

<script>

// The AWS SDK and MD5 library are bundled into this file (see the first script tag), so nothing loads from a CDN.
const { S3Client, ListObjectsV2Command, PutObjectCommand, Upload, createMD5 } = window.AWSLibs || {};

/* ---------- Configuration: fill in after the AWS setup ---------- */
const CFG = {
  region: "us-west-2",
  bucket: "mjolnir.assets-784505366114-us-west-2-an",
  prefix: "LA",
  userPoolId: "us-west-2_d4gjWFn5M",       // e.g. us-west-2_AbCdEfGhI
  clientId: "2vomjjftcs6aqt1lc7staec805",         // user pool app client id (no secret)
  identityPoolId: "us-west-2:12a63cea-de45-4ef1-a1db-d866f139d919",   // e.g. us-west-2:xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  saveRunLogToS3: true,           // writes a JSON run log to <prefix>/_upload-logs/
  fileConcurrency: 3,
  partSizeMB: 16
};

const $ = (id) => document.getElementById(id);
const state = { root: null, dates: [], files: [], items: [], filter: "active", running: false, scanToken: 0, user: null };
let s3 = null, ac = null, tokens = null, pendingChallenge = null;
const logs = [];
const activeUploads = new Set();

/* ---------- Helpers ---------- */
const fmtBytes = (n) => {
  if (!isFinite(n) || n < 1) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"]; const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), 4);
  return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i];
};
const fmtDur = (s) => {
  if (!isFinite(s) || s < 0) return "-";
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${x}s` : `${x}s`;
};
const pad = (n) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; };
const prettyDate = (ymd) => {
  const d = new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8));
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
};
const stamp = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const jwt = (t) => JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));

function explain(e) {
  const n = e?.name || "Error", m = e?.message || String(e);
  if (n === "AccessDenied" || /AccessDenied/.test(m)) return "Access denied. Your account may not be allowed to write to this folder.";
  if (/Expired/i.test(n) || /expired/i.test(m)) return "Your session expired. Sign in again and start the upload to continue.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Network error. Check your connection. If it keeps happening, the bucket CORS settings may not include this site.";
  return `${n}: ${m}`;
}

/* ---------- Log ---------- */
function log(level, msg, detail = false) {
  const entry = { time: new Date().toISOString(), level, msg, detail };
  logs.push(entry);
  appendLogLine(entry);
}
function appendLogLine(entry) {
  if (entry.detail) return;
  const box = $("log");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const row = document.createElement("div");
  row.className = entry.level;
  const t = document.createElement("span"); t.className = "t"; t.textContent = new Date(entry.time).toTimeString().slice(0, 8);
  const m = document.createElement("span"); m.textContent = entry.msg;
  row.append(t, m); box.append(row);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const logText = () => logs.map((l) => `${l.time}  ${l.level.toUpperCase().padEnd(5)}  ${l.msg}`).join("\n");
const csvCell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
function reportCsv() {
  const rows = [["key", "size_bytes", "status", "error"]];
  state.items.forEach((i) => rows.push([i.key, i.size, i.status, i.error || ""]));
  return rows.map((r) => r.map(csvCell).join(",")).join("\n");
}
$("dlLog").onclick = () => download(`upload-log-${state.date || today()}.txt`, logText(), "text/plain");
$("dlCsv").onclick = () => download(`upload-report-${state.date || today()}.csv`, reportCsv(), "text/csv");

/* ---------- Auth ---------- */
async function cognitoCall(service, target, body) {
  const res = await fetch(`https://${service}.${CFG.region}.amazonaws.com/`, {
    method: "POST",
    headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": target },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.message || data.Message || res.statusText);
    err.name = String(data.__type || "Error").split("#").pop();
    throw err;
  }
  return data;
}
const idp = (op, body) => cognitoCall("cognito-idp", `AWSCognitoIdentityProviderService.${op}`, body);
const identity = (op, body) => cognitoCall("cognito-identity", `AWSCognitoIdentityService.${op}`, body);
const providerKey = `cognito-idp.${CFG.region}.amazonaws.com/${CFG.userPoolId}`;

function setTokens(r, email) {
  const a = r.AuthenticationResult;
  tokens = { id: a.IdToken, refresh: a.RefreshToken || tokens?.refresh, exp: jwt(a.IdToken).exp * 1000, email };
  sessionStorage.setItem("lau_refresh", tokens.refresh);
  sessionStorage.setItem("lau_email", email);
}
async function getIdToken() {
  if (!tokens) throw new Error("Not signed in");
  if (tokens.exp - Date.now() < 5 * 60 * 1000) {
    const r = await idp("InitiateAuth", {
      AuthFlow: "REFRESH_TOKEN_AUTH", ClientId: CFG.clientId, AuthParameters: { REFRESH_TOKEN: tokens.refresh }
    });
    setTokens(r, tokens.email);
  }
  return tokens.id;
}
let identityId = null, creds = null, credsInFlight = null;
async function getCredentials() {
  if (creds && creds.expiration.getTime() - Date.now() > 5 * 60 * 1000) return creds;
  if (credsInFlight) return credsInFlight;
  credsInFlight = (async () => {
    const logins = { [providerKey]: await getIdToken() };
    if (!identityId) identityId = (await identity("GetId", { IdentityPoolId: CFG.identityPoolId, Logins: logins })).IdentityId;
    const c = (await identity("GetCredentialsForIdentity", { IdentityId: identityId, Logins: logins })).Credentials;
    creds = { accessKeyId: c.AccessKeyId, secretAccessKey: c.SecretKey, sessionToken: c.SessionToken, expiration: new Date(c.Expiration * 1000) };
    return creds;
  })().finally(() => { credsInFlight = null; });
  return credsInFlight;
}
function buildClient() {
  identityId = null; creds = null;
  s3 = new S3Client({ region: CFG.region, credentials: getCredentials });
}
function showApp(email) {
  state.user = email;
  $("authView").hidden = true; $("appView").hidden = false;
  $("who").hidden = false; $("whoName").textContent = email;
  buildClient();
}
function showAuth(msg) {
  $("appView").hidden = true; $("authView").hidden = false; $("who").hidden = true;
  $("signInForm").hidden = false; $("newPwForm").hidden = true;
  $("authMsg").hidden = !msg; $("authMsg").textContent = msg || "";
}
async function afterAuth(r, email) {
  if (r.ChallengeName === "NEW_PASSWORD_REQUIRED") {
    pendingChallenge = { session: r.Session, email };
    $("signInForm").hidden = true; $("newPwForm").hidden = false; $("authMsg").hidden = true;
    return;
  }
  if (!r.AuthenticationResult) throw new Error("Sign in needs a step this page does not support (" + (r.ChallengeName || "unknown") + ").");
  setTokens(r, email); showApp(email);
}
$("signInForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  try {
    const r = await idp("InitiateAuth", {
      AuthFlow: "USER_PASSWORD_AUTH", ClientId: CFG.clientId,
      AuthParameters: { USERNAME: email, PASSWORD: $("password").value }
    });
    await afterAuth(r, email);
  } catch (err) {
    showAuth(err.name === "NotAuthorizedException" ? "Email or password is incorrect." : explain(err));
  }
});
$("newPwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const r = await idp("RespondToAuthChallenge", {
      ChallengeName: "NEW_PASSWORD_REQUIRED", ClientId: CFG.clientId, Session: pendingChallenge.session,
      ChallengeResponses: { USERNAME: pendingChallenge.email, NEW_PASSWORD: $("newPw").value }
    });
    await afterAuth(r, pendingChallenge.email);
  } catch (err) { showAuth(explain(err)); }
});
$("signOut").onclick = () => {
  if (state.running && !confirm("An upload is running. Sign out and stop it?")) return;
  ac?.abort(); tokens = null; sessionStorage.clear(); location.reload();
};

/* ---------- Folder and date selection ---------- */
if (!window.showDirectoryPicker) { $("compat").hidden = false; $("pickFolder").disabled = true; }

$("pickFolder").onclick = async () => {
  try { state.root = await window.showDirectoryPicker({ mode: "read" }); }
  catch (e) { if (e.name === "AbortError") return; log("error", explain(e)); return; }
  $("folderName").textContent = state.root.name; $("folderName").classList.remove("muted");
  const dates = [];
  for await (const [name, h] of state.root.entries()) {
    if (h.kind === "directory" && /^\d{8}$/.test(name)) dates.push({ name, handle: h });
  }
  if (!dates.length && /^\d{8}$/.test(state.root.name)) dates.push({ name: state.root.name, handle: state.root, self: true });
  dates.sort((a, b) => b.name.localeCompare(a.name));
  state.dates = dates;
  const sel = $("dateSelect");
  sel.replaceChildren();
  $("dateField").hidden = !dates.length;
  if (!dates.length) {
    sel.append(new Option("No dated folders found", "")); sel.disabled = true;
    $("scanInfo").textContent = "No subfolders named like 20261006 in that folder. Choose a different one.";
    $("start").disabled = true; return;
  }
  dates.forEach((d) => sel.append(new Option(prettyDate(d.name), d.name)));
  const t = today();
  sel.value = dates.some((d) => d.name === t) ? t : dates[0].name;
  sel.disabled = false;
  state.note = sel.value !== t ? "No folder for today, so the latest date is selected." : "";
  scanSelected();
};
$("dateSelect").onchange = () => { state.note = ""; scanSelected(); };

async function walk(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "directory") {
      if (name === ".thumbnails") continue;
      await walk(h, prefix + name + "/", out);
    } else {
      if (name.endsWith(".DS_Store")) continue;
      const file = await h.getFile();
      out.push({ rel: prefix + name, file, size: file.size });
    }
  }
}
async function scanSelected() {
  const token = ++state.scanToken;
  const date = $("dateSelect").value;
  $("start").disabled = true;
  $("scanInfo").textContent = "Counting files...";
  const d = state.dates.find((x) => x.name === date);
  const out = [];
  try { await walk(d.handle, "", out); } catch (e) { $("scanInfo").textContent = explain(e); return; }
  if (token !== state.scanToken) return;
  state.date = date; state.files = out;
  const total = out.reduce((a, f) => a + f.size, 0);
  $("scanInfo").textContent = out.length
    ? `${out.length} files, ${fmtBytes(total)}. Uploads to ${CFG.prefix}/${date}/.${state.note ? " " + state.note : ""}`
    : "This folder has no files to upload.";
  $("start").disabled = !out.length || state.running;
}

/* ---------- Run ---------- */
const isMov = (rel) => /\.mov$/i.test(rel) && rel.split("/").length === 2;

function setPhase(t) { $("phase").textContent = t; }

async function listRemote(prefix) {
  const map = new Map(); let token;
  do {
    const r = await s3.send(new ListObjectsV2Command({ Bucket: CFG.bucket, Prefix: prefix, ContinuationToken: token }));
    (r.Contents || []).forEach((o) => map.set(o.Key, o.Size));
    token = r.IsTruncated ? r.NextContinuationToken : undefined;
  } while (token);
  return map;
}

async function md5File(file) {
  const h = await createMD5(); h.init();
  const reader = file.stream().getReader();
  for (;;) {
    if (ac.signal.aborted) throw new Error("cancelled");
    const { done, value } = await reader.read();
    if (done) break;
    h.update(value);
  }
  return h.digest("hex");
}

async function buildManifests(items, base) {
  const bySub = new Map();
  items.filter((i) => isMov(i.rel)).forEach((i) => {
    const sub = i.rel.split("/")[0];
    (bySub.get(sub) || bySub.set(sub, []).get(sub)).push(i);
  });
  const manifests = [];
  let n = 0;
  for (const [sub, list] of bySub) {
    const lines = ["filename,md5"];
    for (const it of list) {
      n++;
      setPhase(`Checking .mov files (${n} of ${[...bySub.values()].flat().length})`);
      const prev = it.status;
      it.status = "hashing"; scheduleRender();
      const sum = await md5File(it.file);
      lines.push(`"${it.rel.split("/")[1]}","${sum}"`);
      it.status = prev;
    }
    const body = new Blob([lines.join("\n") + "\n"], { type: "text/csv" });
    manifests.push({ key: `${base}${sub}/md5_values.csv`, rel: `${sub}/md5_values.csv`, size: body.size, body, type: "text/csv", status: "queued", loaded: 0, kind: "manifest" });
    log("info", `Created md5_values.csv for ${sub} (${list.length} .mov files)`, true);
  }
  return manifests;
}

async function uploadItem(it) {
  for (let attempt = 1; attempt <= 2; attempt++) {
    if (ac.signal.aborted) { it.status = "cancelled"; return; }
    it.status = "uploading"; it.loaded = 0; scheduleRender();
    const up = new Upload({
      client: s3,
      params: { Bucket: CFG.bucket, Key: it.key, Body: it.body, ContentType: it.type || "application/octet-stream" },
      queueSize: 4, partSize: CFG.partSizeMB * 1024 * 1024, leavePartsOnError: false
    });
    activeUploads.add(up);
    up.on("httpUploadProgress", (p) => { if (p.loaded != null) it.loaded = Math.min(p.loaded, it.size); scheduleRender(); });
    try {
      await up.done();
      it.loaded = it.size; it.status = "done"; delete it.error;
      log("ok", `Uploaded ${it.rel} (${fmtBytes(it.size)})`, true);
      return;
    } catch (e) {
      if (ac.signal.aborted) { it.status = "cancelled"; return; }
      it.error = explain(e);
      const fatal = /Access denied|session expired/i.test(it.error);
      if (attempt === 1 && !fatal) { log("warn", `Retrying ${it.rel}: ${it.error}`); continue; }
      it.status = "failed";
      log("error", `Failed ${it.rel}: ${it.error}`);
      return;
    } finally { activeUploads.delete(up); }
  }
}

let renderQueued = false;
function scheduleRender() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); } }

const statusLabel = (i) => ({
  queued: "Waiting", hashing: "Checking", uploading: `Uploading ${i.size ? Math.floor((i.loaded / i.size) * 100) : 0}%`,
  done: "Uploaded", skipped: "Already in S3", failed: "Failed", cancelled: "Cancelled"
}[i.status]);

function renderRows() {
  const rank = (i) => (i.status === "uploading" || i.status === "hashing" ? 0 : i.status === "failed" ? 1 : i.status === "queued" ? 2 : 3);
  const list = state.items.slice().sort((x, y) => rank(x) - rank(y));
  const shown = list.slice(0, 200);
  $("rows").replaceChildren(...shown.map((i) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.className = "name"; a.textContent = i.rel;
    if (i.error) { const e = document.createElement("div"); e.className = "small muted"; e.textContent = i.error; a.append(e); }
    const b = document.createElement("td"); b.className = "num"; b.textContent = fmtBytes(i.size);
    const s = document.createElement("td"); s.className = "st st-" + i.status; s.textContent = statusLabel(i);
    tr.append(a, b, s); return tr;
  }));
  $("rowsNote").textContent = list.length > 200 ? `Showing 200 of ${list.length}. The downloaded report lists every file.` : "";
}
$("filesBox").addEventListener("toggle", renderRows);

let speed = 0, lastBytes = 0, lastT = 0, startedAt = 0;
function render() {
  const items = state.items;
  const c = (s) => items.filter((i) => i.status === s).length;
  const done = c("done"), skipped = c("skipped"), failed = c("failed");
  const sendable = items.filter((i) => i.status !== "skipped");
  const totalBytes = sendable.reduce((a, i) => a + i.size, 0);
  const sent = sendable.reduce((a, i) => a + (i.status === "done" ? i.size : i.loaded || 0), 0);
  $("bar").style.width = (totalBytes ? (sent / totalBytes) * 100 : 0) + "%";
  const now = Date.now();
  if (now - lastT > 1000) { const inst = ((sent - lastBytes) / (now - lastT)) * 1000; speed = speed ? speed * 0.7 + inst * 0.3 : inst; lastBytes = sent; lastT = now; }
  const parts = [`${done + skipped} of ${items.length} files`];
  if (skipped) parts.push(`${skipped} already in S3`);
  parts.push(`${fmtBytes(sent)} sent`);
  if (state.running && speed > 0) parts.push(`${fmtBytes(speed)}/s`, `about ${fmtDur((totalBytes - sent) / speed)} left`);
  const line = $("statline");
  line.textContent = parts.join(", ");
  if (failed) { const f = document.createElement("span"); f.className = "failed"; f.textContent = `${failed} failed`; line.append(", ", f); }
  $("fileCount").textContent = `(${items.length})`;
  if ($("filesBox").open) renderRows();
}

window.addEventListener("beforeunload", (e) => { if (state.running) { e.preventDefault(); e.returnValue = ""; } });

$("cancel").onclick = () => {
  if (!confirm("Stop the upload? Files already uploaded stay in S3. You can start again later and finished files will be skipped.")) return;
  ac.abort(); activeUploads.forEach((u) => u.abort()); log("warn", "Cancel requested.");
};

$("start").onclick = async () => {
  if (state.running) return;
  state.running = true; ac = new AbortController(); logs.length = 0; $("log").replaceChildren();
  $("runView").hidden = false; $("filesBox").open = false; $("start").hidden = true; $("cancel").hidden = false;
  $("pickFolder").disabled = true; $("dateSelect").disabled = true;
  speed = 0; lastBytes = 0; lastT = Date.now(); startedAt = Date.now();
  let wake = null; try { wake = await navigator.wakeLock?.request("screen"); } catch {}

  const date = state.date, base = `${CFG.prefix}/${date}/`;
  const wantManifest = true;
  const mkType = (f) => f.type || (/\.mov$/i.test(f.name) ? "video/quicktime" : "");
  state.items = state.files
    .filter((f) => !(wantManifest && /(^|\/)md5_values\.csv$/.test(f.rel) && f.rel.split("/").length === 2))
    .map((f) => ({ key: base + f.rel, rel: f.rel, size: f.size, body: f.file, file: f.file, type: mkType(f.file), status: "queued", loaded: 0, kind: "file" }));
  render();
  log("info", `Started by ${state.user}`);
  log("info", `Source: ${state.dates.find((x) => x.name === date)?.self ? state.root.name : state.root.name + "/" + date}  Destination: s3://${CFG.bucket}/${base}`);
  log("info", `${state.items.length} files, ${fmtBytes(state.items.reduce((a, i) => a + i.size, 0))}`);

  let fatal = false;
  try {
    setPhase("Checking what is already in S3");
    const remote = await listRemote(base);
    log("info", `${remote.size} objects already in S3 under this date`);
    state.items.forEach((i) => { if (remote.get(i.key) === i.size) { i.status = "skipped"; } });
    const skipped = state.items.filter((i) => i.status === "skipped").length;
    if (skipped) log("info", `Skipping ${skipped} files that are already in S3 with the same size`);

    if (wantManifest) {
      const manifests = await buildManifests(state.items.filter((i) => i.status !== "skipped" || isMov(i.rel)), base);
      state.items.push(...manifests);
    }

    const queue = state.items.filter((i) => i.status === "queued");
    setPhase(`Uploading ${queue.length} files`);
    let idx = 0;
    const worker = async () => { while (!ac.signal.aborted) { const it = queue[idx++]; if (!it) return; await uploadItem(it); } };
    await Promise.all(Array.from({ length: CFG.fileConcurrency }, worker));
  } catch (e) {
    if (!ac.signal.aborted) { fatal = true; log("error", explain(e)); }
  }

  const c = (s) => state.items.filter((i) => i.status === s).length;
  const cancelled = ac.signal.aborted;
  const summary = { user: state.user, date, bucket: CFG.bucket, prefix: base, uploaded: c("done"), skipped: c("skipped"), failed: c("failed"), notStarted: c("queued") + c("cancelled"), cancelled, seconds: Math.round((Date.now() - startedAt) / 1000) };
  summary.stoppedByError = fatal;
  setPhase(cancelled ? "Cancelled" : fatal ? "Stopped by an error" : summary.failed ? `Finished with ${summary.failed} failed` : "Upload complete");
  log(fatal ? "error" : cancelled || summary.failed ? "warn" : "ok",
    `${cancelled ? "Cancelled" : fatal ? "Stopped by an error" : "Finished"}: ${summary.uploaded} uploaded, ${summary.skipped} skipped, ${summary.failed} failed, ${summary.notStarted} not started, in ${fmtDur(summary.seconds)}`);
  if (summary.failed || cancelled || fatal) log("info", "Press Start upload again to retry. Files already in S3 are skipped.");

  if (CFG.saveRunLogToS3) {
    try {
      const key = `${CFG.prefix}/_upload-logs/${date}_${new Date().toISOString().replace(/[:.]/g, "-")}_${(state.user || "user").replace(/[^a-z0-9@.-]/gi, "_")}.json`;
      await s3.send(new PutObjectCommand({ Bucket: CFG.bucket, Key: key, ContentType: "application/json",
        Body: JSON.stringify({ summary, files: state.items.map(({ key, size, status, error }) => ({ key, size, status, error })), log: logs }, null, 2) }));
      log("info", `Run log saved to s3://${CFG.bucket}/${key}`);
    } catch (e) { log("warn", "Could not save the run log to S3: " + explain(e)); }
  }

  try { await wake?.release(); } catch {}
  state.running = false; $("cancel").hidden = true; $("start").hidden = false; $("start").disabled = false; $("start").textContent = "Upload again";
  if (summary.failed) $("filesBox").open = true;
  $("pickFolder").disabled = false; $("dateSelect").disabled = false;
  render();
};

/* ---------- Boot ---------- */
window.addEventListener("error", (e) => {
  if (!e.message || /ResizeObserver/.test(e.message)) return;
  $("authView").hidden = false; $("signInForm").hidden = true;
  $("authMsg").hidden = false; $("authMsg").textContent = "The page hit an error: " + e.message + ". Reload the page. If it keeps happening, send this message to the data team.";
});
(async function boot() {
  if (!window.AWSLibs) { showAuth("The page's upload libraries did not load. Reload the page."); $("signInForm").hidden = true; return; }
  if ([CFG.userPoolId, CFG.clientId, CFG.identityPoolId].some((v) => v.startsWith("REPLACE"))) {
    showAuth("This page is not configured yet. Fill in the Cognito IDs in the CFG block at the top of the script."); $("signInForm").hidden = true; return;
  }
  const refresh = sessionStorage.getItem("lau_refresh"), email = sessionStorage.getItem("lau_email");
  if (refresh && email) {
    try {
      tokens = { refresh, email, exp: 0, id: "" };
      await getIdToken(); showApp(email); return;
    } catch { tokens = null; sessionStorage.clear(); }
  }
  showAuth();
})();

</script>
</body>
</html>
