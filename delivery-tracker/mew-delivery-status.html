<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mew delivery status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFC; --surface:#FFFFFF; --ink:#16163A; --muted:#64677E; --line:#E3E4EC;
  --brand:#2D2A8C;
  --s-todo:#9A9DB0;  --s-todo-bg:#EEEFF4;
  --s-prog:#85B7EB;  --s-prog-bg:#E6F1FB;  --s-prog-light:#85B7EB;
  --s-done:#185FA5;  --s-done-bg:#DDEAFC;
  --track-good:#19774B; --track-good-bg:#DDF2E7;
  --track-bad:#B92E25; --track-bad-bg:#FBE3E1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101024; --surface:#181833; --ink:#ECECF7; --muted:#9FA2BC; --line:#2B2B4D;
    --brand:#A5A2FF;
    --s-todo:#8286A3; --s-todo-bg:#23233F;
    --s-prog:#B5D4F4; --s-prog-bg:#0C447C; --s-prog-light:#B5D4F4;
    --s-done:#378ADD; --s-done-bg:#042C53;
    --track-good:#5FD39B; --track-good-bg:#143A29;
    --track-bad:#FF8A80; --track-bad-bg:#47201D;
  }
}
:root[data-theme="dark"]{
  --bg:#101024; --surface:#181833; --ink:#ECECF7; --muted:#9FA2BC; --line:#2B2B4D;
  --brand:#A5A2FF;
  --s-todo:#8286A3; --s-todo-bg:#23233F;
  --s-prog:#B5D4F4; --s-prog-bg:#0C447C; --s-prog-light:#B5D4F4;
  --s-done:#378ADD; --s-done-bg:#042C53;
  --track-good:#5FD39B; --track-good-bg:#143A29;
  --track-bad:#FF8A80; --track-bad-bg:#47201D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}

/* header */
.heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap-reverse;margin-bottom:.5rem}
h1{font-size:clamp(1.75rem,5vw,2.5rem);line-height:1.15;font-weight:400;letter-spacing:-.02em;margin:0}
.study{color:var(--ink);font-weight:800}
.sub{color:var(--muted);margin:0}

.status-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:1.25rem 1.5rem;margin-top:1rem;box-shadow:0 1px 2px rgba(16,16,36,.06)}
.status-card-top{display:flex;align-items:flex-start;gap:1.5rem;flex-wrap:wrap}
.status-card-top .track-badge{margin-left:auto}
.metric{display:flex;flex-direction:column;gap:.3rem}
.metric-label{font-size:.85rem;color:var(--muted);margin:0}
.metric-value{font-size:1.15rem;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em}
.metric-value .metric-unit{font-size:1rem;font-weight:400;color:var(--muted)}
.track-badge{display:inline-flex;align-items:center;gap:.5rem;font-size:.95rem;font-weight:700;
  color:var(--track-good);background:var(--track-good-bg);border-radius:999px;padding:.5rem 1rem;white-space:nowrap}
.track-badge.behind{color:var(--track-bad);background:var(--track-bad-bg)}
.track-badge[hidden]{display:none}
.track-dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;flex:none}
.status-card-divider{height:1px;background:var(--line);margin:1.1rem 0}
.freshness{display:flex;align-items:center;font-size:.95rem;font-weight:300;color:var(--muted);margin:.75rem 0 0}
.freshness strong{font-weight:300;color:var(--muted)}
.freshness-ago{color:var(--muted);margin-left:.3rem}
.fresh-label{margin-right:.35rem}

.meta-row{display:flex;align-items:center;gap:.9rem;margin:1rem 0 .25rem;font-size:.95rem;color:var(--muted);flex-wrap:wrap}
.meta-label{color:var(--muted)}
.complete-banner{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:1.72rem;font-weight:700;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:.85rem 1rem;margin-top:1rem;box-shadow:0 1px 2px rgba(16,16,36,.06)}
.complete-banner[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.step[data-status="prog"] .node svg{display:block;animation:spin 1.6s linear infinite;transform-origin:50% 50%}
.meta-item strong{color:var(--ink);font-weight:700}
.meta-sep{width:1px;height:1rem;background:var(--line)}

/* segmented progress */
.segments{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:.5rem 0 2.5rem}
.seg{height:10px;border-radius:2px;background:var(--s-todo-bg)}

/* steps */
ol.steps{list-style:none;margin:0;padding:0;position:relative}
.step{display:grid;grid-template-columns:1.5rem 1fr;column-gap:1rem;position:relative;padding-bottom:1.5rem}
.step:not(:last-child)::before{content:"";position:absolute;left:calc(.75rem - 1px);top:1.6rem;bottom:0;width:2px;background:var(--line);z-index:0}
.node{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:600;
  position:relative;z-index:1;
  color:var(--surface);background:var(--c);margin-top:.1rem}
.body{min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem}
.title{font-weight:500;font-size:1.05rem;margin:0;flex:1 1 16rem}
.step[data-status="done"] .title{color:var(--muted)}
.pill{font-size:.85rem;font-weight:600;color:var(--c);background:var(--cb);border-radius:999px;padding:.3rem .8rem}
.step[data-status="prog"] .pill{color:var(--s-done);background:var(--s-done-bg)}
.stamp{font-size:.78rem;color:var(--muted);margin:.2rem 0 0 0}

[data-status="todo"]{--c:var(--s-todo);--cb:var(--s-todo-bg)}
[data-status="prog"]{--c:var(--s-prog);--cb:var(--s-prog-bg)}
[data-status="done"]{--c:var(--s-done);--cb:var(--s-done-bg)}
.seg[data-status]{background:var(--c)}
.seg[data-status="todo"]{background:var(--cb)}
.seg[data-status="prog"]{background:var(--s-prog-light)}
.step[data-status="prog"] .node{background:transparent;color:var(--s-prog)}
.step[data-status="todo"] .node{background:transparent;border:1.5px solid var(--s-todo)}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="heading-row">
      <h1><span class="study">Mew</span> Client Delivery - Live Updates</h1>
    </div>

    <div class="status-card">
      <div class="status-card-top">
        <div class="metric">
          <p class="metric-label">Progress</p>
          <p class="metric-value"><strong id="stepsDone">0</strong> <span class="metric-unit">of <span id="stepsTotal">9</span> steps</span></p>
        </div>
        <div class="metric">
          <p class="metric-label">Target delivery</p>
          <p class="metric-value" id="targetValue">&mdash;</p>
        </div>
        <span id="trackBadge" class="track-badge"><span class="track-dot"></span><span id="trackLabel">On track</span></span>
      </div>
      <p class="freshness"><span class="fresh-label">Last updated</span> <strong id="freshTime">&mdash;</strong><span id="freshAgo" class="freshness-ago"></span></p>
    </div>

    <div id="completeBanner" class="complete-banner" hidden><svg viewBox="0 0 20 20" width="28" height="28" fill="#EAB308" aria-hidden="true"><path d="M11 2 4 12h5l-1 6 8-11h-5l1-5Z"/></svg> Delivery Complete!</div>

    <div class="meta-row">
      <span class="meta-label">Sets to deliver</span>
      <span class="meta-item"><strong id="liveSetsValue">&mdash;</strong> Live</span>
      <span class="meta-sep" aria-hidden="true"></span>
      <span class="meta-item"><strong id="spoofSetsValue">&mdash;</strong> Spoof</span>
    </div>

    <div class="segments" id="segments" role="img" aria-label="Progress by step"></div>
  </header>

  <ol class="steps" id="steps"></ol>
</main>

<script>
(function(){
  var PROJECT = "Mew Client";
  var STEPS = [
    {id:"one-off",        title:"Address DT 1-off requests"},
    {id:"relationship-csv", title:"Prepare relationship CSV"},
    {id:"transfer-spoof", title:"Transfer Spoof Identities metadata to Delivery Data sheet"},
    {id:"qa-edits",       title:"Apply QA edits of video metadata in Delivery Data (Live & Spoof)"},
    {id:"bridgette",      title:"Run validation & S3 scanning scripts"},
    {id:"anomalies",      title:"Correct anomalies & errors"},
    {id:"execute",        title:"Execute delivery"},
    {id:"delivery-issues",title:"Address issues revealed during delivery"},
    {id:"notify-client",  title:"Notify client of delivery completion & details"}
  ];
  var STATUS_LABEL = {todo:"Not started", prog:"In progress", done:"Complete"};
  var STATUS_MARK  = {todo:"", prog:"\u2022", done:"\u2713"};
  var PROG_ICON = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2 A10 10 0 0 1 12 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M12 22 A10 10 0 0 1 12 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1.5 3.4" opacity="0.55"/></svg>';
  var $ = function(id){return document.getElementById(id);};

  function fmtStamp(iso){
    if(!iso) return "";
    var d = new Date(iso); if(isNaN(d)) return "";
    return "Updated " + d.toLocaleString([], {hour:"numeric", minute:"2-digit", timeZone:"America/Los_Angeles"}).replace(/\s/, "") + " PT";
  }
  function fmtDate(ymd){
    if(!ymd) return "Not set";
    var p = ymd.split("-"), d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    if(isNaN(d)) return ymd;
    var weekday = d.toLocaleDateString([], {weekday:"short"});
    return weekday + " " + (d.getMonth()+1) + "/" + d.getDate();
  }
  function fmtTime(hhmm){
    if(!hhmm) return "Not set";
    var p = hhmm.split(":"), h = parseInt(p[0],10);
    var ap = h >= 12 ? "PM" : "AM", h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ap + " PT";
  }
  function nowPTStamp(){
    var fmt = new Intl.DateTimeFormat("en-US", {timeZone:"America/Los_Angeles", hour12:false,
      year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
    var o = {}; fmt.formatToParts(new Date()).forEach(function(p){ o[p.type] = p.value; });
    var hh = o.hour === "24" ? "00" : o.hour;
    return Number(o.year + o.month + o.day + hh + o.minute);
  }
  function targetPTStamp(ymd, hhmm){
    if(!ymd || !hhmm) return null;
    var dp = ymd.split("-"), hp = hhmm.split(":");
    return Number(dp[0] + dp[1] + dp[2] + hp[0] + (hp[1] || "00"));
  }
  function latestUpdate(steps){
    var max = null;
    Object.keys(steps || {}).forEach(function(id){
      var u = steps[id] && steps[id].updatedAt;
      if(u){ var d = new Date(u); if(!isNaN(d) && (!max || d > max)) max = d; }
    });
    return max;
  }
  function agoText(d){
    if(!d) return "";
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if(mins < 1) return "(just now)";
    if(mins < 60) return "(" + mins + "m ago)";
    var hrs = Math.floor(mins/60), rem = mins % 60;
    return "(" + hrs + "h" + (rem ? " " + rem + "m" : "") + " ago)";
  }
  var lastUpdateDate = null;
  setInterval(function(){
    if(lastUpdateDate) $("freshAgo").textContent = " " + agoText(lastUpdateDate);
  }, 30000);

  function render(data){
    var steps = (data && data.steps) || {};
    var counts = {done:0, prog:0, todo:0};

    var segWrap = $("segments"); segWrap.innerHTML = "";
    var listWrap = $("steps"); listWrap.innerHTML = "";

    STEPS.forEach(function(step){
      var s = steps[step.id] || {};
      var status = STATUS_LABEL[s.status] ? s.status : "todo";
      counts[status]++;

      var seg = document.createElement("div"); seg.className = "seg"; seg.setAttribute("data-status", status);
      seg.title = step.title + ": " + STATUS_LABEL[status];
      segWrap.appendChild(seg);

      var li = document.createElement("li"); li.className = "step"; li.setAttribute("data-status", status);
      var node = document.createElement("span"); node.className = "node";
      node.innerHTML = (status === "prog") ? PROG_ICON : STATUS_MARK[status];
      var body = document.createElement("div"); body.className = "body";
      var row = document.createElement("div"); row.className = "row";
      var title = document.createElement("h2"); title.className = "title"; title.textContent = step.title;
      var pill = document.createElement("span"); pill.className = "pill"; pill.textContent = STATUS_LABEL[status];
      var stamp = document.createElement("p"); stamp.className = "stamp"; stamp.textContent = fmtStamp(s.updatedAt) + (s.by ? " by " + s.by : "");
      row.appendChild(title); row.appendChild(pill);
      body.appendChild(row); body.appendChild(stamp);
      li.appendChild(node); li.appendChild(body);
      listWrap.appendChild(li);
    });

    $("liveSetsValue").textContent = (data && data.liveSets != null) ? data.liveSets : "—";
    $("spoofSetsValue").textContent = (data && data.spoofSets != null) ? data.spoofSets : "—";

    var total = STEPS.length;
    $("stepsDone").textContent = counts.done;
    $("stepsTotal").textContent = total;

    var datePart = (data && data.deliveryDate) ? fmtDate(data.deliveryDate) : "";
    var timePart = (data && data.targetDelivery) ? fmtTime(data.targetDelivery) : "";
    $("targetValue").textContent = (datePart || timePart) ? [datePart, timePart].filter(Boolean).join(", ") : "Not set";

    var badge = $("trackBadge"), label = $("trackLabel");
    if(counts.done === total){
      badge.hidden = true;
    } else if(data && targetPTStamp(data.deliveryDate, data.targetDelivery) != null && nowPTStamp() > targetPTStamp(data.deliveryDate, data.targetDelivery)){
      badge.hidden = false; badge.className = "track-badge behind"; label.textContent = "Behind";
    } else {
      badge.hidden = false; badge.className = "track-badge"; label.textContent = "On track";
    }
    $("completeBanner").hidden = (counts.done !== total);

    lastUpdateDate = latestUpdate(data && data.steps);
    $("freshTime").textContent = lastUpdateDate
      ? lastUpdateDate.toLocaleString([], {hour:"numeric", minute:"2-digit", timeZone:"America/Los_Angeles"}).replace(/\s/, "") + " PT"
      : "—";
    $("freshAgo").textContent = lastUpdateDate ? " " + agoText(lastUpdateDate) : "";

    document.title = PROJECT + " Delivery - Live Updates";
  }

  fetch("status.json", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("missing"); return r.json(); })
    .then(render)
    .catch(function(){
      render(null);
    });
})();
</script>
</body>
</html>
